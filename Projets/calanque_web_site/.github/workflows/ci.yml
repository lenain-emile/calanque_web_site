name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node.js pour le frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'calanque_web_site/frontend/mon-projet/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd calanque_web_site/frontend/mon-projet
          npm ci

      - name: Lint frontend
        run: |
          cd calanque_web_site/frontend/mon-projet
          npm run lint

      - name: Build frontend
        run: |
          cd calanque_web_site/frontend/mon-projet
          npm run build

      # PHP pour le backend
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: calanque_web_site/backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('calanque_web_site/backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        run: |
          cd calanque_web_site/backend
          composer install --prefer-dist --no-progress --no-suggest

      - name: Validate PHP syntax
        run: |
          find calanque_web_site/backend -name "*.php" -exec php -l {} \;

      - name: Test User Functionality
        run: |
          cd calanque_web_site/backend
          php tests/UserFunctionalityTest.php

